_format_version: "3.0"

# ==========================================
# SalesChampionHub - Kong API Gateway 配置
# 统一API入口，支持路由、限流、CORS等功能
# ==========================================

services:
  # =======================================
  # 子项目0: 用户中心 Custom API
  # =======================================
  - name: user-center-api
    url: http://user-center-custom-api:3003
    tags:
      - user-center
      - authentication

    routes:
      # 所有用户中心API路由
      - name: user-center-all-routes
        paths:
          - /api/v1/auth
          - /api/v1/users
          - /api/v1/tenants
          - /api/v1/organizations
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https

    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          credentials: true
          max_age: 3600

      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
          policy: local

  # =======================================
  # 子项目1: AI知识库管理平台
  # =======================================
  - name: knowledge-base-api
    url: http://kb-api-server:8080
    tags:
      - knowledge-base
      - ai

    routes:
      # 所有KB API路由
      - name: kb-all-routes
        paths:
          - /api/v1
        strip_path: false
        preserve_host: false
        protocols:
          - http
          - https

    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
          credentials: true
          max_age: 3600

      - name: rate-limiting
        config:
          minute: 200
          hour: 5000
          policy: local

# ==========================================
# 全局插件
# ==========================================
plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
