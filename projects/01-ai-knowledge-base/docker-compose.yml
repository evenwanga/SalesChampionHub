version: '3.8'

# ==========================================
# 子项目1: AI知识库管理平台
# 使用共享基础设施层 (../infrastructure)
# ==========================================

services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-api-server
    ports:
      - "8080:8080"
    environment:
      # 数据库连接（使用共享 PostgreSQL）
      - DB_HOST=saleschampion-postgres
      - DB_PORT=5432
      - DB_NAME=knowledge_platform
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-SalesChampion_PG_2024}
      - DB_SSLMODE=disable

      # Redis连接（使用共享 Redis DB 1）
      - REDIS_HOST=saleschampion-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-SalesChampion_Redis_2024}
      - REDIS_DB=1

      # 用户中心连接（通过Kong访问）
      - USER_CENTER_API=${USER_CENTER_API:-http://kong-gateway:8000/api}
      - USER_CENTER_API_KEY=${USER_CENTER_API_KEY}
      - USER_CENTER_TIMEOUT=30

      # 服务配置
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-debug}
      - SERVER_READ_TIMEOUT=30
      - SERVER_WRITE_TIMEOUT=30

      # 功能开关
      - ENABLE_AUDIT_LOG=true
      - ENABLE_CACHE=true
      - CACHE_TTL_SECONDS=300

      # 查询限制
      - MAX_KB_QUERY_LIMIT=4
    networks:
      - saleschampion_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  saleschampion_network:
    external: true
    name: infrastructure_saleschampion_network
