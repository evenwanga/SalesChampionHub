basePath: /api/v1
definitions:
  handler.AskRequestBody:
    type: object
  handler.BatchDeleteRequest:
    properties:
      document_ids:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - document_ids
    type: object
  handler.BatchDeleteResponse:
    properties:
      failed_count:
        type: integer
      failed_ids:
        items:
          type: string
        type: array
      success_count:
        type: integer
    type: object
  handler.BatchEmbeddingRequest:
    properties:
      texts:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - texts
    type: object
  handler.BatchEmbeddingResponse:
    properties:
      count:
        example: 2
        type: integer
      dimension:
        example: 1024
        type: integer
      embeddings:
        items:
          items:
            format: float32
            type: number
          type: array
        type: array
      model:
        example: BAAI/bge-large-zh-v1.5
        type: string
    type: object
  handler.BatchUpdateStatusRequest:
    properties:
      document_ids:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
      set_processed_at:
        type: boolean
      status:
        enum:
        - pending
        - processing
        - completed
        - failed
        type: string
      trigger_reprocess:
        description: Only for pending status
        type: boolean
    required:
    - document_ids
    - status
    type: object
  handler.BatchUpdateStatusResponse:
    properties:
      errors:
        items:
          type: string
        type: array
      failed_count:
        type: integer
      failed_ids:
        items:
          type: string
        type: array
      success_count:
        type: integer
    type: object
  handler.CPUMetrics:
    properties:
      cores:
        type: integer
      usage_percent:
        type: number
    type: object
  handler.DiskMetrics:
    properties:
      free:
        type: integer
      path:
        type: string
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
    type: object
  handler.DocumentChunksResponse:
    properties:
      chunks:
        items:
          $ref: '#/definitions/models.DocumentChunk'
        type: array
      document_id:
        type: string
      document_name:
        type: string
      limit:
        type: integer
      offset:
        type: integer
      stats:
        $ref: '#/definitions/repository.ChunkStats'
      total:
        type: integer
    type: object
  handler.DocumentPreviewResponse:
    properties:
      chunk_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      document_id:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
      filename:
        type: string
      processed_at:
        type: string
      status:
        type: string
    type: object
  handler.EmbeddingRequest:
    properties:
      text:
        example: 如何使用AI知识库进行语义搜索？
        type: string
    required:
    - text
    type: object
  handler.EmbeddingResponse:
    properties:
      dimension:
        example: 1024
        type: integer
      embedding:
        items:
          type: number
        type: array
      model:
        example: BAAI/bge-large-zh-v1.5
        type: string
    type: object
  handler.MemoryMetrics:
    properties:
      free:
        type: integer
      total:
        type: integer
      used:
        type: integer
      used_percent:
        type: number
    type: object
  handler.NetworkMetrics:
    properties:
      bytes_recv:
        type: integer
      bytes_sent:
        type: integer
    type: object
  handler.RuntimeMetrics:
    properties:
      go_version:
        type: string
      goroutines:
        type: integer
      last_gc_time:
        type: string
      mem_alloc_mb:
        type: integer
      mem_total_mb:
        type: integer
      num_cpu:
        type: integer
      num_gc:
        type: integer
    type: object
  handler.SearchRequestBody:
    type: object
  handler.ServiceInfo:
    properties:
      available:
        type: boolean
      latency:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  handler.SystemMetrics:
    properties:
      cpu:
        $ref: '#/definitions/handler.CPUMetrics'
      disk:
        $ref: '#/definitions/handler.DiskMetrics'
      memory:
        $ref: '#/definitions/handler.MemoryMetrics'
      network:
        $ref: '#/definitions/handler.NetworkMetrics'
    type: object
  handler.SystemStatusResponse:
    properties:
      runtime:
        $ref: '#/definitions/handler.RuntimeMetrics'
      services:
        additionalProperties:
          $ref: '#/definitions/handler.ServiceInfo'
        type: object
      status:
        type: string
      system:
        $ref: '#/definitions/handler.SystemMetrics'
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  handler.UpdateDocumentStatusRequest:
    properties:
      set_processed_at:
        type: boolean
      status:
        enum:
        - pending
        - processing
        - completed
        - failed
        type: string
    required:
    - status
    type: object
  handler.UpdateMountPermissionsRequest:
    properties:
      permissions:
        $ref: '#/definitions/models.JSONMap'
    required:
    - permissions
    type: object
  middleware.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  middleware.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/middleware.ErrorDetail'
      meta:
        $ref: '#/definitions/middleware.MetaInfo'
      success:
        type: boolean
    type: object
  middleware.MetaInfo:
    properties:
      path:
        type: string
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  middleware.PaginatedResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/middleware.MetaInfo'
      pagination:
        $ref: '#/definitions/middleware.Pagination'
      success:
        type: boolean
    type: object
  middleware.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  middleware.SuccessResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/middleware.MetaInfo'
      success:
        type: boolean
    type: object
  models.AuditDetails:
    additionalProperties: true
    type: object
  models.AuditLog:
    properties:
      action:
        type: string
      created_at:
        type: string
      details:
        $ref: '#/definitions/models.AuditDetails'
      duration_ms:
        type: integer
      error_message:
        type: string
      id:
        type: integer
      ip_address:
        type: string
      request_method:
        type: string
      request_path:
        type: string
      resource_id:
        type: string
      resource_type:
        type: string
      status:
        type: string
      tenant_id:
        type: string
      user_agent:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  models.AuditLogStats:
    properties:
      success_rate:
        type: number
      top_actions:
        items:
          additionalProperties: true
          type: object
        type: array
      top_users:
        items:
          additionalProperties: true
          type: object
        type: array
      total_operations:
        type: integer
      unique_users:
        type: integer
    type: object
  models.Document:
    properties:
      chunk_count:
        type: integer
      content:
        type: string
      content_hash:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
      filename:
        type: string
      id:
        type: string
      kb_id:
        type: string
      knowledge_base:
        allOf:
        - $ref: '#/definitions/models.KnowledgeBase'
        description: Relations
      metadata:
        $ref: '#/definitions/models.JSONMap'
      processed_at:
        type: string
      status:
        description: pending, processing, completed, failed
        type: string
      updated_at:
        type: string
      uploaded_by:
        type: string
    type: object
  models.DocumentChunk:
    properties:
      chunk_index:
        type: integer
      content:
        type: string
      content_length:
        type: integer
      created_at:
        type: string
      document:
        allOf:
        - $ref: '#/definitions/models.Document'
        description: Relations
      document_id:
        type: string
      id:
        type: string
      kb_id:
        type: string
      metadata:
        $ref: '#/definitions/models.JSONMap'
    type: object
  models.JSONMap:
    additionalProperties: true
    type: object
  models.KnowledgeBase:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      document_count:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      last_updated_at:
        type: string
      name:
        type: string
      owner_id:
        description: From sub-project 0
        type: string
      settings:
        $ref: '#/definitions/models.JSONMap'
      tags:
        items:
          type: string
        type: array
      total_size_bytes:
        type: integer
      updated_at:
        type: string
      visibility:
        description: public, private, shared
        type: string
    type: object
  models.KnowledgeBaseMount:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      kb_id:
        type: string
      knowledge_base:
        allOf:
        - $ref: '#/definitions/models.KnowledgeBase'
        description: Relations
      mount_type:
        description: tenant, organization, user
        type: string
      mounted_at:
        type: string
      mounted_by:
        type: string
      organization_id:
        type: string
      permissions:
        $ref: '#/definitions/models.JSONMap'
      tenant_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.QueryLog:
    properties:
      created_at:
        type: string
      id:
        type: integer
      kb_ids:
        items:
          type: string
        type: array
      latency_ms:
        type: integer
      metadata:
        $ref: '#/definitions/models.JSONMap'
      query_text:
        type: string
      query_type:
        type: string
      result_count:
        type: integer
      tenant_id:
        type: string
      top_kb_id:
        type: string
      user_id:
        type: string
    type: object
  models.UserAuditStats:
    properties:
      error_count:
        type: integer
      failure_count:
        type: integer
      success_count:
        type: integer
      top_actions:
        items:
          additionalProperties: true
          type: object
        type: array
      total_operations:
        type: integer
    type: object
  repository.ChunkStats:
    properties:
      avg_chunk_size:
        type: number
      max_chunk_size:
        type: integer
      min_chunk_size:
        type: integer
      total_chunks:
        type: integer
      total_tokens:
        type: integer
    type: object
  repository.QueryStatsGrouped:
    properties:
      ask_count:
        description: Ask-type queries
        type: integer
      avg_processing_time_ms:
        description: Average processing time
        type: number
      period:
        description: Date period (YYYY-MM-DD)
        type: string
      search_count:
        description: Search-type queries
        type: integer
      total_queries:
        description: Total queries in period
        type: integer
    type: object
  repository.SearchResult:
    properties:
      chunk_id:
        type: string
      chunk_index:
        type: integer
      content:
        type: string
      distance:
        description: Cosine distance (0 = identical, 2 = opposite)
        type: number
      document_id:
        type: string
      file_type:
        type: string
      filename:
        type: string
      id:
        type: string
      kb_id:
        type: string
      similarity:
        description: Converted to similarity score (0-1)
        type: number
      text_boost:
        type: number
      vector_distance:
        type: number
    type: object
  service.AskResponse:
    properties:
      answer:
        type: string
      confidence:
        description: 0-1 confidence score
        type: number
      context:
        description: 'Optional: return context used'
        type: string
      kbs_searched:
        type: integer
      latency_ms:
        type: integer
      sources:
        items:
          $ref: '#/definitions/service.Source'
        type: array
    type: object
  service.CreateKBRequest:
    properties:
      description:
        type: string
      name:
        type: string
      organization_id:
        description: From context, set by handler
        type: string
      owner_id:
        type: string
      owner_type:
        description: tenant, organization, user
        type: string
      settings:
        $ref: '#/definitions/models.JSONMap'
      tags:
        items:
          type: string
        type: array
      tenant_id:
        description: From context, set by handler
        type: string
      visibility:
        description: public, private, shared
        type: string
    required:
    - name
    - owner_id
    - owner_type
    type: object
  service.MountKBRequest:
    properties:
      kb_id:
        type: string
      mounted_by:
        type: string
      organization_id:
        type: string
      permissions:
        $ref: '#/definitions/models.JSONMap'
      tenant_id:
        type: string
      user_id:
        type: string
    required:
    - kb_id
    - mounted_by
    - tenant_id
    type: object
  service.SearchResponse:
    properties:
      kbs_searched:
        type: integer
      latency_ms:
        type: integer
      results:
        items:
          $ref: '#/definitions/repository.SearchResult'
        type: array
      total_count:
        type: integer
    type: object
  service.Source:
    properties:
      chunk_id:
        type: string
      chunk_index:
        type: integer
      content_snippet:
        type: string
      document_id:
        type: string
      filename:
        type: string
      kb_id:
        type: string
      similarity:
        type: number
    type: object
  service.UpdateKBRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      settings:
        $ref: '#/definitions/models.JSONMap'
      tags:
        items:
          type: string
        type: array
      visibility:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@saleschampionhub.com
    name: 技术支持
  description: "企业级AI知识库管理平台，支持多租户、RLS数据隔离和向量搜索功能。\n\n## \U0001F510 认证说明\n所有接口都需要JWT
    Token认证（从子项目0用户中心获取）。\n使用用户中心的 `/api/v1/auth/login` 接口获取Token。\n\n## ✨ 核心特性\n-
    多租户架构：租户/组织/用户三级隔离\n- Row-Level Security (RLS)：数据库级别的数据隔离\n- 三级挂载系统：租户 > 组织 >
    用户权限继承\n- 向量搜索：基于pgvector的语义搜索（1024维向量）\n- Redis多层缓存：热点数据缓存优化\n- 完整用户中心集成：统一认证授权"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: AI知识库管理平台 API
  version: "1.0"
paths:
  /api/v1/audit-logs:
    get:
      consumes:
      - application/json
      description: 查询审计日志，支持多种过滤条件
      parameters:
      - description: 租户ID
        in: query
        name: tenant_id
        type: string
      - description: 用户ID
        in: query
        name: user_id
        type: string
      - description: 操作类型
        in: query
        name: action
        type: string
      - description: 资源类型
        in: query
        name: resource_type
        type: string
      - description: 资源ID
        in: query
        name: resource_id
        type: string
      - description: 状态
        in: query
        name: status
        type: string
      - description: 开始时间
        in: query
        name: start_time
        type: string
      - description: 结束时间
        in: query
        name: end_time
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 查询审计日志
      tags:
      - 审计日志
  /api/v1/audit-logs/{id}:
    get:
      consumes:
      - application/json
      description: 根据ID获取审计日志详情
      parameters:
      - description: 审计日志ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditLog'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 获取审计日志详情
      tags:
      - 审计日志
  /api/v1/audit-logs/export:
    get:
      consumes:
      - application/json
      description: 导出审计日志为CSV或JSON格式
      parameters:
      - description: 导出格式（csv/json）
        in: query
        name: format
        required: true
        type: string
      - description: 租户ID
        in: query
        name: tenant_id
        type: string
      - description: 用户ID
        in: query
        name: user_id
        type: string
      - description: 操作类型
        in: query
        name: action
        type: string
      - description: 资源类型
        in: query
        name: resource_type
        type: string
      - description: 开始时间
        in: query
        name: start_time
        type: string
      - description: 结束时间
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 导出审计日志
      tags:
      - 审计日志
  /api/v1/audit-logs/stats:
    get:
      consumes:
      - application/json
      description: 获取指定租户的审计统计信息
      parameters:
      - description: 统计天数（默认30天）
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuditLogStats'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 获取租户审计统计
      tags:
      - 审计日志
  /api/v1/audit-logs/users/{user_id}/stats:
    get:
      consumes:
      - application/json
      description: 获取指定用户的审计统计信息
      parameters:
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: string
      - description: 统计天数（默认30天）
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserAuditStats'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 获取用户审计统计
      tags:
      - 审计日志
  /api/v1/system/metrics:
    get:
      description: 获取当前时刻的关键性能指标快照
      produces:
      - application/json
      responses:
        "200":
          description: 指标快照
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取指标快照
      tags:
      - 监控
  /api/v1/system/status:
    get:
      description: 获取详细的系统状态信息，包括CPU、内存、磁盘、网络等指标
      produces:
      - application/json
      responses:
        "200":
          description: 系统状态信息
          schema:
            $ref: '#/definitions/handler.SystemStatusResponse'
      security:
      - BearerAuth: []
      summary: 获取系统状态
      tags:
      - 监控
  /ask:
    post:
      consumes:
      - application/json
      description: 基于知识库内容回答问题，使用检索增强生成(RAG)技术。通过BGE-large-zh模型(1024维向量)进行语义检索，结合千问(Qwen)大语言模型生成准确回答
      parameters:
      - description: 问答请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AskRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: 回答成功
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.AskResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "403":
          description: 无权访问指定知识库
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: RAG 问答
      tags:
      - RAG
  /ask-stream:
    post:
      consumes:
      - application/json
      description: 基于知识库内容回答问题（流式响应），使用检索增强生成(RAG)技术。通过BGE-large-zh模型(1024维向量)进行语义检索，结合千问(Qwen)大语言模型实时流式生成回答
      parameters:
      - description: 问答请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AskRequestBody'
      produces:
