basePath: /api/v1
definitions:
  handler.AskRequestBody:
    type: object
  handler.SearchRequestBody:
    type: object
  middleware.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  middleware.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/middleware.ErrorDetail'
      meta:
        $ref: '#/definitions/middleware.MetaInfo'
      success:
        type: boolean
    type: object
  middleware.MetaInfo:
    properties:
      path:
        type: string
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  middleware.PaginatedResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/middleware.MetaInfo'
      pagination:
        $ref: '#/definitions/middleware.Pagination'
      success:
        type: boolean
    type: object
  middleware.Pagination:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total_count:
        type: integer
      total_pages:
        type: integer
    type: object
  middleware.SuccessResponse:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/middleware.MetaInfo'
      success:
        type: boolean
    type: object
  models.Document:
    properties:
      chunk_count:
        type: integer
      content:
        type: string
      content_hash:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      file_path:
        type: string
      file_size:
        type: integer
      file_type:
        type: string
      filename:
        type: string
      id:
        type: string
      kb_id:
        type: string
      knowledge_base:
        allOf:
        - $ref: '#/definitions/models.KnowledgeBase'
        description: Relations
      metadata:
        $ref: '#/definitions/models.JSONMap'
      processed_at:
        type: string
      status:
        description: pending, processing, completed, failed
        type: string
      updated_at:
        type: string
      uploaded_by:
        type: string
    type: object
  models.JSONMap:
    additionalProperties: true
    type: object
  models.KnowledgeBase:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      document_count:
        type: integer
      id:
        type: string
      last_updated_at:
        type: string
      name:
        type: string
      owner_id:
        description: From sub-project 0
        type: string
      settings:
        $ref: '#/definitions/models.JSONMap'
      tags:
        items:
          type: string
        type: array
      total_size_bytes:
        type: integer
      updated_at:
        type: string
      visibility:
        description: public, private, shared
        type: string
    type: object
  models.KnowledgeBaseMount:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      kb_id:
        type: string
      knowledge_base:
        allOf:
        - $ref: '#/definitions/models.KnowledgeBase'
        description: Relations
      mount_type:
        description: tenant, organization, user
        type: string
      mounted_at:
        type: string
      mounted_by:
        type: string
      organization_id:
        type: string
      permissions:
        $ref: '#/definitions/models.JSONMap'
      tenant_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.QueryLog:
    properties:
      created_at:
        type: string
      id:
        type: integer
      kb_ids:
        items:
          type: string
        type: array
      latency_ms:
        type: integer
      metadata:
        $ref: '#/definitions/models.JSONMap'
      query_text:
        type: string
      result_count:
        type: integer
      tenant_id:
        type: string
      top_kb_id:
        type: string
      user_id:
        type: string
    type: object
  repository.SearchResult:
    properties:
      chunk_id:
        type: string
      chunk_index:
        type: integer
      content:
        type: string
      distance:
        description: Cosine distance (0 = identical, 2 = opposite)
        type: number
      document_id:
        type: string
      file_type:
        type: string
      filename:
        type: string
      id:
        type: string
      kb_id:
        type: string
      similarity:
        description: Converted to similarity score (0-1)
        type: number
      text_boost:
        type: number
      vector_distance:
        type: number
    type: object
  service.AskResponse:
    properties:
      answer:
        type: string
      confidence:
        description: 0-1 confidence score
        type: number
      context:
        description: 'Optional: return context used'
        type: string
      kbs_searched:
        type: integer
      latency_ms:
        type: integer
      sources:
        items:
          $ref: '#/definitions/service.Source'
        type: array
    type: object
  service.CreateKBRequest:
    properties:
      description:
        type: string
      name:
        type: string
      owner_id:
        type: string
      settings:
        $ref: '#/definitions/models.JSONMap'
      tags:
        items:
          type: string
        type: array
      visibility:
        description: public, private, shared
        type: string
    required:
    - name
    - owner_id
    type: object
  service.MountKBRequest:
    properties:
      kb_id:
        type: string
      mounted_by:
        type: string
      organization_id:
        type: string
      permissions:
        $ref: '#/definitions/models.JSONMap'
      tenant_id:
        type: string
      user_id:
        type: string
    required:
    - kb_id
    - mounted_by
    - tenant_id
    type: object
  service.SearchResponse:
    properties:
      kbs_searched:
        type: integer
      latency_ms:
        type: integer
      results:
        items:
          $ref: '#/definitions/repository.SearchResult'
        type: array
      total_count:
        type: integer
    type: object
  service.Source:
    properties:
      chunk_id:
        type: string
      chunk_index:
        type: integer
      content_snippet:
        type: string
      document_id:
        type: string
      filename:
        type: string
      kb_id:
        type: string
      similarity:
        type: number
    type: object
  service.UpdateKBRequest:
    properties:
      description:
        type: string
      name:
        type: string
      settings:
        $ref: '#/definitions/models.JSONMap'
      tags:
        items:
          type: string
        type: array
      visibility:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@saleschampionhub.com
    name: 技术支持
  description: "企业级AI知识库管理平台，支持多租户、RLS数据隔离和向量搜索功能。\n\n## \U0001F510 认证说明\n所有接口都需要JWT
    Token认证（从子项目0用户中心获取）。\n使用用户中心的 `/api/v1/auth/login` 接口获取Token。\n\n## ✨ 核心特性\n-
    多租户架构：租户/组织/用户三级隔离\n- Row-Level Security (RLS)：数据库级别的数据隔离\n- 三级挂载系统：租户 > 组织 >
    用户权限继承\n- 向量搜索：基于pgvector的语义搜索（1024维向量）\n- Redis多层缓存：热点数据缓存优化\n- 完整用户中心集成：统一认证授权"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: AI知识库管理平台 API
  version: "1.0"
paths:
  /ask:
    post:
      consumes:
      - application/json
      description: 基于知识库内容回答问题，使用检索增强生成(RAG)技术。通过BGE-large-zh模型(1024维向量)进行语义检索，结合千问(Qwen)大语言模型生成准确回答
      parameters:
      - description: 问答请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AskRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: 回答成功
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/service.AskResponse'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "403":
          description: 无权访问指定知识库
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: RAG 问答
      tags:
      - RAG
  /documents:
    get:
      description: List documents in a knowledge base with pagination and filters
      parameters:
      - description: Knowledge Base ID
        in: query
        name: kb_id
        required: true
        type: string
      - default: 50
        description: Number of results per page
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by status (pending, processing, completed, failed)
        in: query
        name: status
        type: string
      - description: Filter by file type (.pdf, .docx, .md, etc.)
        in: query
        name: file_type
        type: string
      - description: Search in filename and content
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Document'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List documents
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      description: Upload a document file (PDF, Word, Markdown, TXT, HTML) to a knowledge
        base
      parameters:
      - description: Knowledge Base ID
        in: formData
        name: kb_id
        required: true
        type: string
      - description: Document file
        in: formData
        name: file
        required: true
        type: file
      - default: false
        description: Check for duplicate documents
        in: formData
        name: check_duplicate
        type: boolean
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Document'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "415":
          description: Unsupported file type
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a document to a knowledge base
      tags:
      - documents
  /documents/{id}:
    delete:
      description: Soft delete a document by ID
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                message:
                  type: string
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a document
      tags:
      - documents
    get:
      description: Get a document by its ID
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Document'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a document
      tags:
      - documents
  /knowledge-bases:
    get:
      description: 分页获取知识库列表，支持多种过滤条件
      parameters:
      - default: 20
        description: 每页数量（默认：20）
        in: query
        name: limit
        type: integer
      - default: 0
        description: 偏移量（默认：0）
        in: query
        name: offset
        type: integer
      - default: created_at DESC
        description: 排序字段（默认：created_at DESC）
        in: query
        name: order_by
        type: string
      - description: 可见性过滤（public/private/restricted）
        in: query
        name: visibility
        type: string
      - description: 所有者ID过滤
        in: query
        name: owner_id
        type: string
      - description: 搜索关键词（在名称和描述中搜索）
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 知识库列表
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    knowledge_bases:
                      items:
                        $ref: '#/definitions/models.KnowledgeBase'
                      type: array
                    limit:
                      type: integer
                    offset:
                      type: integer
                    total:
                      type: integer
                  type: object
              type: object
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 列出知识库
      tags:
      - 知识库管理
    post:
      consumes:
      - application/json
      description: 创建一个新的知识库。如果未指定所有者，将自动设置为当前用户。
      parameters:
      - description: 知识库创建请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateKBRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 知识库创建成功
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    knowledge_base:
                      $ref: '#/definitions/models.KnowledgeBase'
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建知识库
      tags:
      - 知识库管理
  /knowledge-bases/{id}:
    delete:
      description: 软删除知识库，同时会删除所有关联的文档和向量数据
      parameters:
      - description: 知识库ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 知识库删除成功
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    message:
                      type: string
                  type: object
              type: object
        "400":
          description: 知识库ID必填
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: 知识库不存在
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除知识库
      tags:
      - 知识库管理
    get:
      description: 获取指定知识库的详细信息，包括统计数据
      parameters:
      - description: 知识库ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 知识库详情
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    knowledge_base:
                      $ref: '#/definitions/models.KnowledgeBase'
                    stats:
                      type: object
                  type: object
              type: object
        "400":
          description: 知识库ID必填
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: 知识库不存在
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取知识库详情
      tags:
      - 知识库管理
    put:
      consumes:
      - application/json
      description: 更新知识库的名称、描述、设置等信息
      parameters:
      - description: 知识库ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateKBRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 知识库更新成功
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    knowledge_base:
                      $ref: '#/definitions/models.KnowledgeBase'
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: 知识库不存在
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新知识库
      tags:
      - 知识库管理
  /knowledge-bases/{id}/stats:
    get:
      description: 获取知识库的详细统计信息，包括文档数量、总大小、状态分布等
      parameters:
      - description: 知识库ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 知识库统计信息
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    document_count:
                      type: integer
                    status_breakdown:
                      type: object
                    total_size_bytes:
                      type: integer
                  type: object
              type: object
        "400":
          description: 知识库ID必填
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取知识库统计
      tags:
      - 知识库管理
  /mounts/{id}:
    delete:
      description: 移除知识库挂载，撤销指定级别的访问权限
      parameters:
      - description: 挂载ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 挂载已移除
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    message:
                      type: string
                  type: object
              type: object
        "400":
          description: 挂载ID无效
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "404":
          description: 挂载不存在
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 取消知识库挂载
      tags:
      - 知识库挂载
  /mounts/organization:
    post:
      consumes:
      - application/json
      description: 将知识库挂载到组织级别，组织内所有用户都可访问
      parameters:
      - description: 挂载请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.MountKBRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 挂载成功
          schema:
            allOf:
            - $ref: '#/definitions/middleware.SuccessResponse'
            - properties:
                data:
                  properties:
                    mount:
                      $ref: '#/definitions/models.KnowledgeBaseMount'
                  type: object
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 挂载知识库到组织
      tags:
      - 知识库挂载
  /mounts/tenant:
    post:
      consumes:
      - application/json
      description: 将知识库挂载到租户级别，租户内所有用户都可访问
      parameters:
      - description: 挂载请求
        in: body
        name: request
        required: true
