# ==========================================
# Docker Compose - AI 知识库管理平台前端
# ==========================================

services:
  kb-frontend:
    container_name: kb-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: saleschampion/kb-frontend:latest
    ports:
      - "3000:80"
    environment:
      # Logto 配置
      VITE_LOGTO_ENDPOINT: ${VITE_LOGTO_ENDPOINT:-http://localhost:3001}
      VITE_LOGTO_APP_ID: ${VITE_LOGTO_APP_ID}
      VITE_LOGTO_REDIRECT_URI: ${VITE_LOGTO_REDIRECT_URI:-http://localhost:3000/callback}
      VITE_LOGTO_POST_LOGOUT_REDIRECT_URI: ${VITE_LOGTO_POST_LOGOUT_REDIRECT_URI:-http://localhost:3000}
      VITE_LOGTO_API_RESOURCE: ${VITE_LOGTO_API_RESOURCE:-https://api.saleschampionhub.com/kb}

      # 后端 API 地址
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    networks:
      - saleschampion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  saleschampion-network:
    external: true
    name: infrastructure_saleschampion_network
