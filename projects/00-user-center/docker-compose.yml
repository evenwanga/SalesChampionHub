version: '3.8'

# ==========================================
# 子项目0: 多租户统一用户中心
# 使用共享基础设施层 (../infrastructure)
# ==========================================

services:
  # Logto 核心服务
  logto:
    image: ghcr.io/logto-io/logto:latest
    container_name: logto-core
    ports:
      - "3001:3001"  # 核心API
      - "3002:3002"  # 管理控制台
    environment:
      # 数据库连接（使用共享 PostgreSQL）
      - DB_URL=postgresql://postgres:${DB_PASSWORD:-SalesChampion_PG_2024!Secure}@saleschampion-postgres:5432/logto

      # 服务端点（生产环境需要修改为实际域名）
      - ENDPOINT=http://localhost:3001
      - ADMIN_ENDPOINT=http://localhost:3002

      # 信任的代理（使用Kong）
      - TRUST_PROXY_HEADER=1

      # 日志级别
      - LOG_LEVEL=info
    networks:
      - saleschampion_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 自定义扩展API（我们开发的部分）
  custom-api:
    build:
      context: ./custom-api
      dockerfile: Dockerfile
    container_name: user-center-custom-api
    env_file:
      - ./custom-api/.env
    ports:
      - "3003:3003"
    environment:
      # Logto连接
      - LOGTO_ENDPOINT=http://logto:3001
      - LOGTO_ADMIN_ENDPOINT=http://logto:3002

      # 数据库连接（使用共享 PostgreSQL）
      - DB_URL=postgresql://postgres:${DB_PASSWORD:-SalesChampion_PG_2024!Secure}@saleschampion-postgres:5432/logto

      # Redis连接（使用共享 Redis DB 0）
      - REDIS_URL=redis://saleschampion-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-SalesChampion_Redis_2024}
      - REDIS_DB=0
      - AUDIT_LOG_ENABLED=false

      # 服务密钥（用于服务间调用）
      - SERVICE_API_KEY=${SERVICE_API_KEY}

      # JWT配置
      - JWT_SECRET=${JWT_SECRET}

      # 日志
      - LOG_LEVEL=debug
      - NODE_ENV=development
    depends_on:
      logto:
        condition: service_started
    networks:
      - saleschampion_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  saleschampion_network:
    external: true
    name: infrastructure_saleschampion_network
